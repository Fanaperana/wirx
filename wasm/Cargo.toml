[package]
name = "wirx-wasm"
version = "0.1.0"
edition = "2024"
description = "wirx compiled to WebAssembly: check, build and import designs from JavaScript"
license = "MIT"
repository = "https://github.com/Fanaperana/wirx"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wirx = { path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
