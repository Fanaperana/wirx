[package]
name = "wirx"
version = "0.1.0"
edition = "2024"
description = "Schematic-as-code: a DSL that compiles circuits into laid-out, checked schematics"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wirx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rhai = { version = "1.26", features = ["debugging", "metadata"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v5"] }
